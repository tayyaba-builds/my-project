<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS bounce ball</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .container {
            background-color: rgb(2, 63, 17);
            height: 80vh;
            width: 80vw;
            position: relative;
        }

        @keyframes animateX {
            from {
                left: 0;
            }

            to {
                left: 100%
            }
        }

        @keyframes animateY {
            from {
                bottom: 0;
            }

            to {
                bottom: 100%;
            }
        }

        .box {
            background-color: rgb(165, 35, 126);
            border: 2px solid pink;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
            height: 121px;
            width: 121px;
            text-align: center;

            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: animateX 5s linear infinite, animateY 1s cubic-bezier(0.02, 0.29, 0, 0.59) infinite alternate;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">🐒</div>
    </div>
</body>

</html>
